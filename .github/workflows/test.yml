# Runs the lint, unit and browser tests on every pull request, on main after a merge, and
# by hand. The tests use a fake `claude`, so this needs no Claude Code install, token or
# secret.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same pull request cancels the run still going for the old one. Each push to main
# and each run by hand has its own group (event and commit), so no newer run cancels or replaces it.
concurrency:
  group: test-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # Funtown runs only on macOS, so its tests run there too.
    runs-on: macos-latest
    # A passing run takes about 7.5 minutes; a slow macOS runner has taken over 10.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright's Chromium
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
        if: steps.chromium.outputs.cache-hit != 'true'
      - run: npm test
      # Playwright writes test-results/ only for the tests that failed.
      - name: Keep the failed browser tests' output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-tests
          path: test-results/
          retention-days: 7
