# Runs the lint, unit and browser tests on every pull request. The tests use a fake
# `claude`, so this needs no Claude Code install, token or secret.
name: test

on:
  pull_request:

# A new push to the same pull request cancels the run still going for the old one.
concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Funtown is macOS-only: the jump uses osascript, the hook reads ttys with ps.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      - run: npm test
