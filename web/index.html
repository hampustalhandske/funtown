<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Funtown</title>
    <style>
      :root { --ink: #2b2230; --paper: #fffaf0; --clay: #efe6d6; --stone: #f7f4ee; --ribbon: #c94f4f; --error: #b0363b; }
      html, body, #root { margin: 0; height: 100%; overflow: hidden; }
      body { background: var(--clay); color: var(--ink); font-family: "Recursive Variable", system-ui, sans-serif;
        font-variation-settings: "CASL" 1; line-height: 1.35; }
      .village { position: fixed; inset: 0; }
      #plates { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .plate { white-space: nowrap; font-size: 0.85rem; font-weight: 650; padding: 0.1rem 0.6rem; background: var(--paper);
        border: 2px solid var(--ink); border-radius: 0.55rem; box-shadow: 0 2px 0 var(--ink); pointer-events: none; }

      /* The town list, for screen readers and keyboards: invisible 2 px rows, since a pointer lands on whole pixels and a
         1 px row's centre would land on the next row; a focused row shows as a plate. */
      .town-list { position: fixed; top: 0; left: 0; margin: 0; padding: 0; list-style: none; z-index: 1; }
      .town-list li { height: 2px; }
      .town-list :is(a, button, span) { display: block; width: 2px; height: 2px; padding: 0; border: 0; overflow: hidden; white-space: nowrap;
        opacity: 0; font: inherit; color: inherit; background: none; text-decoration: none; }
      .town-list :is(a, button):focus-visible { position: fixed; top: 1rem; left: 1rem; width: auto; height: auto; opacity: 1;
        padding: 0.3rem 0.8rem; background: var(--paper); border: 2px solid var(--ink); border-radius: 0.55rem; box-shadow: 0 2px 0 var(--ink); outline: none; }

      /* The whiteboard's text in the classroom: a paper card over the 3D board. */
      .board { box-sizing: border-box; padding: 0.4rem 0.7rem; background: var(--paper); color: var(--ink); border: 2px solid var(--ink);
        border-radius: 0.6rem; font-family: "Recursive Variable", system-ui, sans-serif; font-variation-settings: "CASL" 1; line-height: 1.3;
        text-align: left; pointer-events: none; overflow: hidden; }
      .board h2 { margin: 0 0 0.1rem; font-size: 1.05em; }
      .board p { margin: 0 0 0.2rem; font-size: 0.85em; }
      .board ol { margin: 0.2rem 0 0; padding: 0; list-style: none; font-size: 0.85em; }
      .board li[data-state="done"] { opacity: 0.6; text-decoration: line-through; }
      .board li[data-state="now"] { font-weight: 800; }
      .board li[data-state="later"] { opacity: 0.8; }

      /* Icon buttons: round clay buttons with an ink glyph; Morning keeps its own button under the glyph. */
      .hud { position: fixed; top: 1rem; right: 1rem; z-index: 4; display: flex; gap: 0.6rem; }
      .icon, .slot > button { box-sizing: border-box; width: 2.9rem; height: 2.9rem; padding: 0; display: grid; place-items: center;
        border-radius: 50%; border: 2.5px solid var(--ink); background: var(--paper); box-shadow: 0 3px 0 var(--ink); color: var(--ink); cursor: pointer; }
      .icon:hover, .slot:hover > button { background: #fff; transform: translateY(-1px); }
      .icon:active, .slot > button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
      .icon:focus-visible, .slot > button:focus-visible { outline: 3px solid var(--ribbon); outline-offset: 2px; }
      .slot { position: relative; width: 2.9rem; height: 2.9rem; }
      .slot > button { font-size: 0; color: transparent; }
      .slot > .glyph { position: absolute; left: 50%; top: 50%; translate: -50% -50%; z-index: 1; pointer-events: none; }
      .glyph { width: 1.5rem; height: 1.5rem; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .icon.alert { background: var(--ribbon); animation: pulse 1.2s ease-in-out infinite; }
      .icon.alert .glyph { stroke: #fff; }
      .icon.fog { background: #dcdcdc; cursor: help; }
      .icon.flagged { position: relative; }
      .icon.flagged::after { content: ""; position: absolute; top: -0.2rem; right: -0.2rem; width: 0.8rem; height: 0.8rem;
        border-radius: 50%; background: var(--ribbon); border: 2px solid var(--ink); }
      @keyframes pulse { 50% { box-shadow: 0 3px 0 var(--ink), 0 0 0 7px rgba(201, 79, 79, 0.35); } }

      /* Panes and panels: paper cards with an ink edge. */
      .pane, .panel, .morning { position: fixed; z-index: 5; box-sizing: border-box; background: var(--paper);
        border: 2.5px solid var(--ink); border-radius: 1rem; box-shadow: 0 5px 0 var(--ink); padding: 0.9rem 1.1rem; }
      .pane, .panel, .morning { max-height: calc(100vh - 6.5rem); overflow: auto; overflow-wrap: anywhere; }
      .panel, .pane { top: 5rem; right: 1rem; width: min(23rem, calc(100vw - 2rem)); }
      .dot { display: inline-block; width: 0.65rem; height: 0.65rem; margin-right: 0.35rem; border-radius: 50%; background: #bbb; }
      .dot[data-stage="working"] { background: #2e7d32; }
      .dot[data-stage="needs_you"] { background: #d32f2f; }
      .dot[data-stage="done"] { background: #fff; border: 2px solid var(--ink); box-sizing: border-box; }
      .pane { z-index: 6; }
      .morning { top: 5rem; left: 50%; transform: translateX(-50%); width: min(50rem, calc(100vw - 2rem)); z-index: 7; }
      .switch-box { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
      h2 { margin: 0 2.5rem 0.4rem 0; font-size: 1.2rem; font-weight: 800; }
      h3, h4 { margin: 0.5rem 0 0.2rem; font-size: 0.95rem; }
      .pane .close, .panel .close, .morning .close { position: absolute; top: 0.6rem; right: 0.6rem; }
      .panel .close, .morning .close, .keysheet .close { width: 2rem; height: 2rem; padding: 0; border-radius: 50%; }
      .pane .close { width: 2.2rem; height: 2.2rem; box-shadow: 0 2px 0 var(--ink); }
      .pane .close .glyph { width: 1.1rem; height: 1.1rem; }
      /* The key sheet: a wide pane over the panes, one row per key. */
      .keysheet { width: min(46rem, calc(100vw - 2rem)); z-index: 7; }
      .keysheet p { margin: 0 0 0.6rem; font-size: 0.9rem; }
      .keysheet table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
      .keysheet th, .keysheet td { text-align: left; vertical-align: top; padding: 0.35rem 0.5rem; border-top: 2px dashed #c8b89e; }
      .keysheet th { border-top: 0; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
      .keysheet td.key { white-space: nowrap; }
      /* On a narrow window each key is the key and where on one line, what it does under them: no column gets too narrow. */
      @media (max-width: 600px) {
        .keysheet thead { display: none; }
        .keysheet tr { display: grid; grid-template-columns: auto minmax(0, 1fr); border-top: 2px dashed #c8b89e; }
        .keysheet td { border-top: 0; }
        .keysheet td:last-child { grid-column: 1 / -1; padding-top: 0; }
      }
      kbd { display: inline-block; min-width: 1.6em; padding: 0 0.4rem; border: 2px solid var(--ink); border-bottom-width: 3px; border-radius: 0.4rem;
        background: var(--stone); font: 600 0.85rem/1.5 ui-monospace, Menlo, monospace; text-align: center; white-space: nowrap; }
      button { font: inherit; color: inherit; }
      /* A card styles its own buttons (card.css). */
      :is(.pane, .panel, .morning, .letters) button:not(.icon, .answer-card *) { background: var(--stone); border: 2px solid var(--ink); border-radius: 0.6rem;
        box-shadow: 0 2px 0 var(--ink); padding: 0.2rem 0.7rem; cursor: pointer; }
      :is(.pane, .panel, .morning) button:not(.icon, .answer-card *):active { transform: translateY(1px); box-shadow: 0 1px 0 var(--ink); }
      :is(.pane, .panel, .morning) button[aria-pressed="true"] { background: #e6dccb; }
      button:disabled { opacity: 0.5; cursor: default; }
      input, textarea { font: inherit; color: inherit; border: 2px solid var(--ink); border-radius: 0.5rem; padding: 0.3rem 0.5rem; background: #fff; }
      a { color: #5b4a8a; }
      .activity, pre, code, .need { font-variation-settings: "MONO" 1, "CASL" 0; font-size: 0.85rem; }
      .hint { font-weight: 650; }
      .error { color: var(--error); }
      .badge { margin-left: 0.4rem; padding: 0 0.45rem; border-radius: 0.6rem; border: 1.5px solid var(--ink); font-size: 0.75rem; background: var(--stone); }
      .overlap { display: block; font-size: 0.8rem; color: #8a5a00; }
      .terminal { box-sizing: border-box; height: 24rem; margin-top: 0.5rem; padding: 0.5rem; background: #000; border-radius: 0.5rem; overflow: hidden; }
      /* A panel's lines scroll above its buttons, which stay at the bottom, so a card never pushes them out of the window. */
      .panel { display: flex; flex-direction: column; overflow: hidden; }
      .panel .column { min-height: 0; display: flex; flex-direction: column; }
      .panel .lines { min-height: 0; overflow: auto; }
      .column > .actions { flex: none; display: flex; flex-wrap: wrap; gap: 0.5rem; padding-top: 0.5rem; }
      /* The terminal sheet: a 19rem column of the panel's lines, the terminal taking the rest at full height. */
      .panel.sheet { top: 5rem; right: 3rem; bottom: 1rem; left: 3rem; width: auto; max-width: 96rem; max-height: none; margin-inline: auto;
        flex-direction: row; gap: 1rem; }
      .sheet .column { position: relative; flex: 0 0 19rem; box-sizing: border-box; min-width: 0; }
      .sheet .lines { flex: 1; }
      .sheet .column:focus { outline: none; }
      .sheet .screen { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
      /* "Waking the session..." sits over the empty terminal, out of the layout, so nothing moves when it goes. */
      .waking { position: absolute; inset: 0; z-index: 1; margin: 0; display: flex; align-items: center; justify-content: center; color: #ddd; pointer-events: none; }
      .sheet .terminal, .screen[inert] .terminal { flex: 1; height: auto; min-height: 0; margin-top: 0; }
      /* A hidden terminal: off the left edge, unseen, in the box the sheet gives it (the sheet's insets, border and padding, less the column and gap). */
      .panel:not(.sheet) .screen[inert] { position: fixed; right: 100%; top: calc(5rem + 2.5px + 0.9rem); bottom: calc(1rem + 2.5px + 0.9rem);
        width: calc(min(100% - 6rem, 96rem) - 5px - 2.2rem - 20rem); display: flex; flex-direction: column; visibility: hidden; }
      /* On a narrow window the column (11rem, or 60% of the sheet with a card, so its ask reads without scrolling) stacks above the terminal, which keeps the full width. */
      @media (max-width: 860px) {
        .panel.sheet { left: 0.5rem; right: 0.5rem; padding: 0.5rem; flex-direction: column; gap: 0.5rem; }
        .sheet .column { flex: 0 0 11rem; }
        .sheet .column:has(.answer-card) { flex-basis: 60%; }
        .panel:not(.sheet) .screen[inert] { top: calc(5rem + 2.5px + 0.5rem + 11rem + 0.5rem); bottom: calc(1rem + 2.5px + 0.5rem); width: calc(100% - 1rem - 5px - 1rem); }
        .panel:not(.sheet):has(.answer-card) .screen[inert] { top: calc(5rem + 2.5px + 0.5rem + 0.6 * (100vh - 7rem - 5px) + 0.5rem); }
      }
      .letters { margin-top: 0.5rem; max-height: 22rem; overflow: auto; }
      .letter { border-top: 2px dashed #c8b89e; padding: 0.3rem 0; overflow-wrap: anywhere; }
      .letter h3 { margin: 0; font-size: 0.8rem; opacity: 0.7; }
      .letter table { border-collapse: collapse; }
      .letter th, .letter td { border: 1px solid #c8b89e; padding: 0.15rem 0.4rem; }
      .letter pre { overflow: auto; }
      .reply { display: flex; gap: 0.5rem; align-items: flex-end; margin-top: 0.5rem; }
      .reply textarea { flex: 1; box-sizing: border-box; }
      .add-project { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0.4rem 0 0.8rem; }
      .add-project input { flex: 1; min-width: 0; box-sizing: border-box; }
      .add-project .error { flex-basis: 100%; margin: 0; }
      .projects { list-style: none; margin: 0 0 0.8rem; padding: 0; }
      .projects li { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.25rem 0; border-top: 2px dashed #c8b89e; }
      .avatars { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0 0 0.8rem; }
      .pane .avatars .swatch { width: 1.8rem; height: 1.8rem; padding: 0; border: 2px solid var(--ink); border-radius: 50%; }
      .pane .avatars .swatch[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
      .pane .row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
      .toasts { position: fixed; bottom: 1rem; left: 1rem; z-index: 8; display: flex; flex-direction: column; gap: 0.5rem; }
      .toast { display: flex; flex-direction: column; text-align: left; cursor: pointer; padding: 0.55rem 0.9rem; background: var(--paper);
        border: 2.5px solid var(--ribbon); border-radius: 0.8rem; box-shadow: 0 4px 0 var(--ink); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="plates"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
