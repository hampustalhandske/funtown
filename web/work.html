<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Funtown work</title>
    <style>
      body { margin: 0; font-family: "Recursive Variable", system-ui, sans-serif; background: #eef5e9; color: #222; }
      header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 1rem; padding: 1rem 1.5rem; }
      .switch-box { position: fixed; top: 4rem; left: 1rem; right: 1rem; max-width: 30rem; box-sizing: border-box; z-index: 20;
        display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; padding: 0.3rem 0.6rem; background: #fff; border: 2px solid #c8a97e; border-radius: 0.5rem; }
      h1 { margin: 0; font-size: 1.6rem; }
      .alert { margin: 0 1.5rem 1rem; padding: 0.75rem 1rem; border-radius: 0.5rem;
        background: #d32f2f; color: #fff; font-weight: 700; font-size: 1.1rem; }
      .needs-list { margin: 0 1.5rem 1rem; padding: 0.5rem 1rem; border-radius: 0.5rem; background: #fff; border: 2px solid #d32f2f; }
      .needs-list h2 { margin: 0 0 0.25rem; font-size: 1.1rem; color: #d32f2f; }
      .needs-list ol { list-style: none; margin: 0; padding: 0; }
      .needs-list button { font: inherit; background: none; border: 0; cursor: pointer; text-align: left; padding: 0.2rem 0; width: 100%;
        display: flex; flex-wrap: wrap; gap: 0 0.5rem; }
      .needs-list .project { color: #666; }
      .needs-list .need { font-family: ui-monospace, monospace; color: #d32f2f; }
      .needs-list .waited { order: -1; min-width: 3.5rem; color: #666; }
      .needs-list .quiet button { font-size: 0.85em; color: #666; }
      .needs-list .quiet .need { color: #666; }
      .toasts { position: fixed; bottom: 1rem; left: 1rem; display: flex; flex-direction: column; gap: 0.5rem; z-index: 10; }
      .toast { display: flex; flex-direction: column; text-align: left; font: inherit; cursor: pointer; padding: 0.6rem 0.9rem;
        background: #fff; border: 2px solid #d32f2f; border-radius: 0.5rem; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25); }
      @media (max-width: 600px) { .toasts { position: static; margin: 0 1.5rem 1rem; } }
      .empty { margin: 0 1.5rem; color: #555; }
      .town { display: flex; flex-wrap: wrap; gap: 1rem; padding: 0 1.5rem 1.5rem; align-items: flex-start; }
      .house { background: #fffaf0; border: 2px solid #c8a97e; border-radius: 0.75rem; padding: 0.75rem 1rem;
        min-width: 16rem; }
      .house h2 { margin: 0 0 0.5rem; font-size: 1.15rem; }
      .house.needs_you { border-color: #d32f2f; box-shadow: 0 0 0 3px #f8b4b4; }
      ul { list-style: none; margin: 0; padding: 0; }
      .subagents { margin: 0.25rem 0 0.25rem 1.75rem; padding-left: 0.75rem; border-left: 2px dashed #c8a97e; }
      .character { display: flex; width: 100%; font: inherit; color: inherit; text-align: left; border: 0;
        background: none; cursor: pointer; align-items: center; gap: 0.6rem; padding: 0.35rem 0.5rem; border-radius: 0.5rem; }
      .avatar { font-size: 1.6rem; width: 2.4rem; height: 2.4rem; display: flex; align-items: center;
        justify-content: center; border-radius: 50%; border: 3px solid #bbb; background: #fff; }
      .character.working .avatar { border-color: #2e7d32; }
      .character.done .avatar { border-color: #bbb; }
      .gone { opacity: 0.45; }
      .needs_you.character { background: #ffebee; outline: 2px solid #d32f2f; }
      .character.needs_you .avatar { border-color: #d32f2f; animation: pulse 1.2s ease-in-out infinite; }
      .character.needs_you .stage { color: #d32f2f; font-weight: 700; }
      @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(211, 47, 47, 0.35); } }
      .name { font-weight: 600; }
      .stage { margin-left: 0.4rem; font-size: 0.9rem; }
      .dot { display: inline-block; width: 0.65rem; height: 0.65rem; margin-right: 0.35rem; border-radius: 50%; background: #bbb; }
      .dot[data-stage="working"] { background: #2e7d32; }
      .dot[data-stage="needs_you"] { background: #d32f2f; }
      .dot[data-stage="done"] { background: #fff; border: 2px solid #888; box-sizing: border-box; }
      .character .body, .character .line, .character .activity { display: block; }
      .activity { font-family: ui-monospace, monospace; font-size: 0.85rem; color: #444; }
      .panel { position: fixed; top: 1rem; right: 1rem; width: 20rem; background: #fffaf0; border: 2px solid #c8a97e;
        border-radius: 0.75rem; padding: 0.75rem 1rem; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2); }
      /* The key sheet: a wide pane, one row per key. */
      .keysheet { position: fixed; top: 1rem; right: 1rem; z-index: 30; width: min(46rem, calc(100vw - 2rem)); max-height: calc(100vh - 2rem); overflow: auto;
        box-sizing: border-box; background: #fff; border: 2px solid #c8a97e; border-radius: 0.75rem; padding: 0.75rem 1rem; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2); }
      .keysheet h2 { margin: 0 2rem 0.4rem 0; font-size: 1.15rem; }
      .keysheet p { margin: 0 0 0.6rem; font-size: 0.9rem; }
      .keysheet .close { position: absolute; top: 0.5rem; right: 0.5rem; cursor: pointer; }
      .keysheet table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
      .keysheet th, .keysheet td { text-align: left; vertical-align: top; padding: 0.35rem 0.5rem; border-top: 1px solid #ddd5c7; }
      .keysheet th { border-top: 0; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: #666; }
      .keysheet td.key { white-space: nowrap; }
      /* On a narrow window each key is the key and where on one line, what it does under them: no column gets too narrow. */
      @media (max-width: 600px) {
        .keysheet thead { display: none; }
        .keysheet tr { display: grid; grid-template-columns: auto minmax(0, 1fr); border-top: 1px solid #ddd5c7; }
        .keysheet td { border-top: 0; }
        .keysheet td:last-child { grid-column: 1 / -1; padding-top: 0; }
      }
      kbd { display: inline-block; min-width: 1.6em; padding: 0 0.4rem; border: 1px solid #c8a97e; border-bottom-width: 2px; border-radius: 0.3rem;
        background: #f6f1e7; font: 600 0.85rem/1.5 ui-monospace, Menlo, monospace; text-align: center; white-space: nowrap; }
      .kind { margin-left: 0.4rem; font-size: 0.8rem; color: #666; }
      .terminal { box-sizing: border-box; height: 24rem; background: #000; margin-top: 0.5rem; padding: 0.5rem; }
      /* A panel's lines scroll above its buttons, which stay at the bottom, so a card never pushes them out of the window. */
      .panel { display: flex; flex-direction: column; max-height: calc(100vh - 2rem); box-sizing: border-box; overflow: hidden; }
      .panel .column { min-height: 0; display: flex; flex-direction: column; }
      .panel .lines { min-height: 0; overflow: auto; }
      .column > .actions { flex: none; display: flex; flex-wrap: wrap; gap: 0.5rem; padding-top: 0.5rem; }
      /* The terminal sheet: a 19rem column of the panel's lines, the terminal taking the rest at full height. */
      .panel.sheet { top: 5rem; right: 3rem; bottom: 1rem; left: 3rem; width: auto; max-width: 96rem; max-height: none; margin-inline: auto;
        flex-direction: row; gap: 1rem; padding: 0.75rem 1rem; }
      .sheet .column { position: relative; flex: 0 0 19rem; box-sizing: border-box; min-width: 0; }
      .sheet .lines { flex: 1; }
      .sheet .column:focus { outline: none; }
      .sheet .screen { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
      /* "Waking the session..." sits over the empty terminal, out of the layout, so nothing moves when it goes. */
      .waking { position: absolute; inset: 0; z-index: 1; margin: 0; display: flex; align-items: center; justify-content: center; color: #ddd; pointer-events: none; }
      .sheet .terminal, .screen[inert] .terminal { flex: 1; height: auto; min-height: 0; margin-top: 0; }
      /* A hidden terminal: off the left edge, unseen, in the box the sheet gives it (the sheet's insets, border and padding, less the column and gap). */
      .panel:not(.sheet) .screen[inert] { position: fixed; right: 100%; top: calc(5rem + 2px + 0.75rem); bottom: calc(1rem + 2px + 0.75rem);
        width: calc(min(100% - 6rem, 96rem) - 4px - 2rem - 20rem); display: flex; flex-direction: column; visibility: hidden; }
      /* On a narrow window the column (11rem, or 60% of the sheet with a card, so its ask reads without scrolling) stacks above the terminal, which keeps the full width. */
      @media (max-width: 860px) {
        .panel.sheet { left: 0.5rem; right: 0.5rem; padding: 0.5rem; flex-direction: column; gap: 0.5rem; }
        .sheet .column { flex: 0 0 11rem; }
        .sheet .column:has(.answer-card) { flex-basis: 60%; }
        .panel:not(.sheet) .screen[inert] { top: calc(5rem + 2px + 0.5rem + 11rem + 0.5rem); bottom: calc(1rem + 2px + 0.5rem); width: calc(100% - 1rem - 4px - 1rem); }
        .panel:not(.sheet):has(.answer-card) .screen[inert] { top: calc(5rem + 2px + 0.5rem + 0.6 * (100vh - 7rem - 4px) + 0.5rem); }
      }
      .hint { font-weight: 600; }
      .panel h2 { margin: 0; font-size: 1.15rem; }
      .panel .close { position: absolute; top: 0.5rem; right: 0.5rem; cursor: pointer; }
      .badge { margin-left: 0.4rem; padding: 0 0.4rem; border-radius: 0.6rem; font-size: 0.75rem; background: #e6e6ef; color: #333; }
      .badge.phase { background: #dbe7ff; }
      .badge.burning { background: #d32f2f; color: #fff; }
      .badge.handled { background: #ffe9b8; }
      .parcel .waits { margin-left: 0.5rem; font-size: 0.75rem; color: #666; }
      .phase-note { margin-left: 0.5rem; font-size: 0.8rem; font-weight: normal; color: #666; }
      /* The goal and spec lines wrap in full within the house's width: with no width of their own, they never widen it. */
      .phase-line { display: block; contain: inline-size; margin-left: 0.5rem; font-size: 0.8rem; font-weight: normal; color: #666; overflow-wrap: anywhere; }
      .overlap { display: block; font-size: 0.8rem; color: #8a5a00; }
      .parcels { list-style: none; padding: 0; margin: 0.5rem 0; font-size: 0.85rem; }
      .parcel .review { margin-left: 0.5rem; font-size: 0.75rem; }
      /* Long titles, notes and file paths wrap instead of widening the page. */
      .phase-note, .overlap, .parcels { overflow-wrap: anywhere; }
      .mail { margin-left: 0.4rem; }
      /* A card open in the pane is one line in the list, pointing there. */
      .in-pane { margin: 0.4rem 0; font-size: 0.85rem; font-style: italic; color: #666; overflow-wrap: anywhere; }
      .morning { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); width: min(50rem, calc(100vw - 4rem));
        max-height: calc(100vh - 2rem); overflow: auto; background: #fff; border: 2px solid #c8a97e; border-radius: 8px; padding: 1rem; z-index: 5; }
      .morning h2 { margin: 0; font-size: 1.15rem; }
      .morning h4 { margin: 0.5rem 0 0; }
      .morning .close { position: absolute; top: 0.5rem; right: 0.5rem; cursor: pointer; }
      .letters { margin-top: 0.5rem; max-height: 22rem; overflow: auto; }
      .letter { border-top: 1px solid #c8a97e; padding: 0.25rem 0; overflow-wrap: anywhere; }
      .letter h3 { margin: 0; font-size: 0.85rem; color: #666; }
      .letter table { border-collapse: collapse; }
      .letter th, .letter td { border: 1px solid #c8a97e; padding: 0.15rem 0.4rem; }
      .letter pre { overflow: auto; }
      .reply { display: flex; gap: 0.5rem; align-items: flex-end; margin-top: 0.5rem; }
      .reply textarea { flex: 1; box-sizing: border-box; }
      .add-project, .run { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: flex-end; margin: 0 1.5rem 1rem; }
      .add-project input { flex: 1; min-width: 0; box-sizing: border-box; }
      .add-project .error { flex-basis: 100%; margin: 0; overflow-wrap: anywhere; }
      .run { margin: 0.5rem 0; }
      .run textarea { flex: 1; min-width: 0; box-sizing: border-box; }
      .house { max-width: 100%; box-sizing: border-box; }
      .house [role="tabpanel"] { margin-top: 0.5rem; max-width: 100%; }
      .house [role="tab"][aria-selected="true"] { background: #e6e6ef; }
      .error { color: #d32f2f; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/work.tsx"></script>
  </body>
</html>
